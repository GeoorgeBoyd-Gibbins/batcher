name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit + E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: System dependencies for Tk smoke tests
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # py2app is mac-only; install everything else.
          grep -v -E '^py2app' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Run tests under xvfb (Tk smoke tests need a display)
        run: |
          xvfb-run -a pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=55
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
